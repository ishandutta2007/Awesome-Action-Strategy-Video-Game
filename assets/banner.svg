<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 48px; fill: url(#textGrad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #ffffff; }
      
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.7; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }

      .floating-node { animation: floatSlow 6s ease-in-out infinite; }
      .floating-node-2 { animation: floatSlow 8s ease-in-out infinite 1s; }
      .bg-glow { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
      .tactical-line { stroke-dasharray: 8 8; animation: dashMove 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  
  <!-- Dynamic Background Geometric Elements -->
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.05" class="bg-glow" />
  <circle cx="1000" cy="150" r="220" fill="#c084fc" opacity="0.05" class="bg-glow" />

  <!-- Grid Tactical Lines -->
  <path d="M 100 0 L 100 300 M 300 0 L 300 300 M 500 0 L 500 300 M 700 0 L 700 300 M 900 0 L 900 300 M 1100 0 L 1100 300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Tactical Combat Motion Lines (Behind Text) -->
  <path class="tactical-line" d="M 150 220 Q 350 80 600 210 T 1050 90" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />
  
  <!-- Animated Background Elements (Positioned away from main title text) -->
  <g class="floating-node">
    <polygon points="120,70 140,105 100,105" fill="#38bdf8" opacity="0.3" />
    <circle cx="1050" cy="220" r="25" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.5" />
    <rect x="980" y="50" width="30" height="30" rx="6" fill="none" stroke="#f43f5e" stroke-width="2" transform="rotate(15 995 65)" opacity="0.4" />
  </g>
  
  <g class="floating-node-2">
    <circle cx="140" cy="210" r="12" fill="#4ade80" opacity="0.3" />
    <polygon points="1080,120 1100,150 1060,150" fill="#fb923c" opacity="0.4" />
  </g>

  <!-- Foreground Title and Content -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="450" y="35" width="300" height="30" rx="15" fill="url(#accentGrad)" opacity="0.9" />
    <text x="600" y="55" class="badge-text" text-anchor="middle">🎮 CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="600" y="125" class="title" filter="url(#glow)">Awesome Action-Strategy Video Games</text>
    
    <!-- Subtitle -->
    <text x="600" y="170" class="subtitle">Real-Time Tactics • Base Building • Unit Command • Strategic Combat • Open-Source</text>
    
    <!-- Feature Pills -->
    <g transform="translate(310, 210)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="80" y="23" class="badge-text" text-anchor="middle">⚔️ RTS & Tactics</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <text x="270" y="23" class="badge-text" text-anchor="middle">🏰 Base Building</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="200" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <text x="480" y="23" class="badge-text" text-anchor="middle">🌐 100% Open-Source</text>
    </g>
  </g>
</svg>
