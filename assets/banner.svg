<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#fb923c"/></linearGradient><style>@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulseGlow{0%{opacity:.2}50%{opacity:.5}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:900;font-size:44px;fill:url(#textGrad)}.subtitle{font-weight:600;font-size:18px;fill:#94a3b8}.badge-text{font-weight:700;font-size:13px;fill:#fff}.floating-node{animation:floatSlow 6s ease-in-out infinite}.bg-glow{animation:pulseGlow 4s ease-in-out infinite}</style></defs><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="150" r="180" fill="#38bdf8" class="bg-glow" opacity=".05"/><circle cx="1000" cy="150" r="220" fill="#c084fc" class="bg-glow" opacity=".05"/><path stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 100 0 L 100 300 M 300 0 L 300 300 M 500 0 L 500 300 M 700 0 L 700 300 M 900 0 L 900 300 M 1100 0 L 1100 300"/><path stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240"/><path fill="none" stroke="url(#accentGrad)" stroke-dasharray="8 8" stroke-width="2" d="M 100 230 Q 350 70 600 220 T 1100 80" opacity=".3"/><g class="floating-node"><circle cx="120" cy="80" r="15" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".4"/><rect width="24" height="24" x="1050" y="200" fill="none" stroke="#c084fc" stroke-width="2" opacity=".4" rx="4" transform="rotate(15 1062 212)"/></g><g text-anchor="middle"><rect width="300" height="30" x="450" y="35" fill="url(#accentGrad)" rx="15"/><text x="600" y="55" class="badge-text" text-anchor="middle">CURATED AWESOME LIST</text><text x="600" y="125" class="title">Awesome Action-Strategy Video Games</text><text x="600" y="170" class="subtitle">Real-Time Tactics • Base Building • Unit Command • Strategic Combat • Open-Source</text><g transform="translate(310, 205)"><rect width="160" height="36" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="18"/><text x="80" y="23" class="badge-text" text-anchor="middle">RTS &amp; Tactics</text><rect width="180" height="36" x="180" y="0" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" rx="18"/><text x="270" y="23" class="badge-text" text-anchor="middle">Base Building</text><rect width="200" height="36" x="380" y="0" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="18"/><text x="480" y="23" class="badge-text" text-anchor="middle">100% Open-Source</text></g></g></svg>